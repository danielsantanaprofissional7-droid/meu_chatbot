<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu ChatBot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c2f33; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        #chat-container { width: 100%; max-width: 600px; background: #23272a; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 85vh; }
        .header { padding: 20px; background: #1a1c1e; border-radius: 12px 12px 0 0; text-align: center; border-bottom: 1px solid #333; }
        .header h2 { margin: 0; font-size: 20px; color: #7289da; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user-msg { background-color: #7289da; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-msg { background-color: #40444b; align-self: flex-start; border-bottom-left-radius: 0; }
        .loading { font-style: italic; color: #aaa; }
        #input-container { padding: 20px; background: #1a1c1e; border-radius: 0 0 12px 12px; display: flex; gap: 10px; }
        #user-input { flex-grow: 1; padding: 15px; border: none; border-radius: 8px; background: #40444b; color: white; outline: none; font-size: 15px; }
        #user-input::placeholder { color: #888; }
        button { padding: 0 25px; border: none; background: #7289da; color: white; cursor: pointer; border-radius: 8px; font-size: 15px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #5b6eae; }
        
        /* Barra de rolagem customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #23272a; }
        ::-webkit-scrollbar-thumb { background: #40444b; border-radius: 4px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="header">
        <h2>Hermes 3 (405B) - OpenRouter</h2>
    </div>
    <div id="chat-box">
        <div class="message bot-msg">Olá! Como posso ajudar você hoje?</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Digite sua pergunta aqui..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputElement = document.getElementById("user-input");
        const message = inputElement.value.trim();
        if (!message) return;

        appendMessage(message, "user-msg");
        inputElement.value = "";

        // Indicador de digitação
        const loadingId = "loading-" + Date.now();
        appendMessage("Pensando...", "bot-msg", loadingId);
        document.getElementById(loadingId).classList.add("loading");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            
            document.getElementById(loadingId).remove();

            if (response.ok) {
                appendMessage(data.reply, "bot-msg");
            } else {
                appendMessage("Erro: " + data.error, "bot-msg");
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Erro de conexão com o servidor.", "bot-msg");
        }
    }

    function appendMessage(text, className, id = null) {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgDiv.className = "message " + className;
        msgDiv.innerText = text;
        if (id) msgDiv.id = id;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
